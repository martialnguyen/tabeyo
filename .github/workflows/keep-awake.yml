name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 20 "$API_BASE_URL/health"
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
